<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classwork</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
  <form id="emailForm">
    <label for="email">Email address:</label>
    <input type="email" id="email" name="email" required>
    <button type="submit">Confirm</button> <br> <br>

    <label for="username">Username:</label><br>
    <input type="text" id="username">
    <p id="usernameInfo">Username must be at least 4 characters long.</p>

    <label for="age">Age:</label><br>
    <input type="number" id="age">
    <p id="ageInfo">Age must be between 18 and 60.</p>

    <label for="password">Password:</label><br>
    <input type="password" id="password">
    <p id="passwordInfo">Password must be at least 6 characters long.</p>
  </form>
  <script src="./script.js"></script>
</body>
</html>
