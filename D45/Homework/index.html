<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="left-texts">
            <h1>Welcome <br> to Our <br> Platform!</h1>
            <p>Join our community <br> and enjoy exclusive <br> <span>features</span></p>
            <h2>Ready to get <br> started? Join now!</h2>
        </div>
        <div class="login">
            <p id="language">English</p>
            <h1>Get Started</h1>
            <div class="inputs">
                <input class="login-inputs" type="text" name="username" placeholder="  Username">
                <input class="login-inputs" type="email" name="email" placeholder="  Email">
                <input class="login-inputs" type="password" name="password" placeholder="  Password">
                <input class="login-inputs" type="password" name="confirm-password" placeholder="  Confirm password">
                <input id="checkbox" type="checkbox" name="agree">
                <small>i have read and agree to the Terms and Conditions.</small>
                <button id="button1">Sign up</button>
                <div class="or">
                <hr>
                <h2>Or</h2>
                <hr id="hr2">
                </div>
                <button id="button2"><i class="fa-brands fa-google"></i>Continue with Google</button>
            </div>
        </div>
    </div>
</body>
</html>
