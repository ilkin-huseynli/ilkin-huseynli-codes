<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <form action="">
    <div>
        <h2>Cancellation Request Form</h2>
        <label for="name">Name</label>
        <input type="text" id="name" class="name" name="name" placeholder="First Name">
        <input type="text" id="name" class="name" name="name" placeholder="Last Name">
        <label for="email">Email Adress</label>
        <input type="email" id="email" name="email">
        <label for="tel">Phone Number</label>
        <input type="tel" id="tel" name="tel">
        <label for="product">Product / Service to be Canceled</label>
        <input type="text" id="product" name="product">
        <label for="cancellation">Reason for a Cancellation</label>
        <textarea name="cancellation" id="cancellation"></textarea>
        <label for="effective">Effective from</label>
        <input type="date" id="date" name="effective">
        <label for="contact">How can we contact you?</label>
        <select name="contact" id="contact">
            <option value="Select" selected disabled>Select</option>
            <option value="Email">Email</option>
            <option value="Phone Number">Phone Number</option>
        </select>
        <label for="signature">Reason for a Cancellation</label>
        <textarea name="signature" id="signature"></textarea>
        <button id="button1" type="reset">Clear</button>
        <button id="button2" type="submit">Submit</button>
    </div>
    </form>
</body>
</html>
