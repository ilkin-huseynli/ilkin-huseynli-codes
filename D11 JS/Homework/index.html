<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Promokod Daxil Et</h2>
    <input type="text" id="promoInput" placeholder="Promokodu yazın">
    <button id="checkBtn">Yoxla</button>
    <p id="result"></p>

    <h2>Tələbə Balları (Azalan Sırayla)</h2>
    <ul id="studentList"></ul>
    <h2>Tələbə Axtar</h2>
    <input type="text" id="nameInput" placeholder="Tələbənin adını yazın">
    <button id="searchBtn">Axtar</button>
    <p id="result2"></p>

    <h2>Pin-Kod Daxil Et</h2>
    <input type="text" id="pinInput" placeholder="4 rəqəmli pin-kod" maxlength="4" pattern="\d{4}">
    <button id="checkBtn2">Daxil Ol</button>
    <p id="result3"></p>

    <h2>Məhsullar (Ucuzdan Bahaya)</h2>
    <ul id="productList"></ul>
    <h2>Məhsul Axtar</h2>
    <input type="text" id="productInput" placeholder="Məhsulun adını yazın">
    <button id="searchBtn3">Axtar</button>
    <p id="result4"></p>
    <script src="./script.js"></script>
</body>
</html>
