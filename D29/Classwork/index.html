<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classwork</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Type your name">
        <label for="surname">Surname:</label>
        <input type="text" id="surname" name="surname" placeholder="Type your surname">
        <label for="Age:">Age:</label>
        <input type="number" id="age" name="age" placeholder="Your age" min="10" max    ="50">
        <label for="password">Password:</label>
        <input type="text" id="password" name="password" placeholder="Type your password"> 
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <button type="submit">Save</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
