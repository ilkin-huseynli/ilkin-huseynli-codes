<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery Effects</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>jQuery Effects</h1>

  <div class="container">
    <div class="item">
      <div class="box box-toggle">Toggle</div>
      <button id="btn-toggle">Hide</button>
    </div>

    <div class="item">
      <div class="box box-fade">Fade</div>
      <button id="btn-fade">Fade Out</button>
    </div>

    <div class="item">
      <div class="box box-fadeto">Fade To</div>
      <button id="btn-fadeto">Fade To 25%</button>
    </div>

    <div class="item">
      <div class="box box-slide">Slide</div>
      <button id="btn-slide">Slide Up</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
